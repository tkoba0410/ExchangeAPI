name: CI

on:
  pull_request:
  push:
    branches:
      - stage12
      - stage11
      - main
      - master
      - develop
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ExchangeApi.slnx

      - name: Build
        run: dotnet build ExchangeApi.slnx --no-restore

      - name: Test
        run: dotnet test ExchangeApi.slnx --no-build
